<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vídeo privado</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: url('https://raw.githubusercontent.com/house-of-gad/house-of-gad.github.io/refs/heads/main/scr/img/house_background.png') center/cover no-repeat fixed;
    color: #fff;
  }
  .card {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    padding: 32px;
    border-radius: 16px;
    max-width: 90vw;
    width: 900px;
    text-align: center;
  }
  video { width: 100%; border-radius: 10px; margin-top: 12px; }
  input {
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    width: 220px;
    font-size: 16px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #6c5ce7;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    margin-left: 8px;
  }
  #error { color: #ff7675; margin-top: 10px; min-height: 20px; }
  #videoBox { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="gate">
      <h2>House of Gad Latina Royale</h2>
      <p>Introduce la contraseña para ver el vídeo</p>
      <input type="password" id="pass" placeholder="Contraseña">
      <button onclick="checkPass()">Entrar</button>
      <div id="error"></div>
    </div>

    <div id="videoBox">
      <video controls>
        <source src="/api/video" type="video/mp4">
      </video>
    </div>
  </div>

<script>
  async function checkPass() {
    const input = document.getElementById('pass').value;
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ password: input })
    });
    if (res.ok) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('videoBox').style.display = 'block';
    } else {
      document.getElementById('error').textContent = 'Contraseña incorrecta';
    }
  }
  document.getElementById('pass').addEventListener('keyup', e => {
    if (e.key === 'Enter') checkPass();
  });
</script>
</body>
</html>
